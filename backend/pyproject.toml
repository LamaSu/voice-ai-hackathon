[project]
name = "voice-agent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pipecat-ai[gradium,openai,runner,silero,webrtc]>=1.11.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "soundfile>=0.13.1",
    "speechbrain>=1.0",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "typesafe-sdk>=0.7.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls real Jev / Gradium / General Compute APIs"]
addopts = "-m 'not live'"
